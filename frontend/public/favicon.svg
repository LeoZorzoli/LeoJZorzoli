<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop class="light" offset="0"/>
      <stop class="dark" offset="1"/>
    </linearGradient>
  </defs>
  <style>
    .light { stop-color: #2B7D8B; }
    .dark { stop-color: #0D2F36; }
    circle { stroke: #08191D; }
    @media (prefers-color-scheme: dark) {
      .light { stop-color: #9AD6DF; }
      .dark { stop-color: #4E9AA6; }
      circle { stroke: #2C5A61; }
    }
  </style>
  <circle cx="16" cy="16" r="15" fill="url(#g)" stroke-width="0.75"/>
</svg>
